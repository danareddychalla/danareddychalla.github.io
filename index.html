<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bus Alerts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f7fb;
      color: #1f2937;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      padding: 40px 30px;
    }
    h1 {
      margin-bottom: 12px;
      color: #111827;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #075985;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Bus Alerts</h1>
    <p>Welcome to the GitHub Pages site for My Bus Alerts.</p>
    <div class="badge">App status: Live</div>
  </div>
</body>
</html>
